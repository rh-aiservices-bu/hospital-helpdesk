apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-setup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-setup-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: demo-setup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-ticketing
  labels:
    app: mcp-ticketing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-ticketing
  template:
    metadata:
      labels:
        app: mcp-ticketing
    spec:
      containers:
        - name: mcp-ticketing
          image: quay.io/rlundber/hospital-helpdesk-mcp-ticketing:0.3
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-ticketing
  labels:
    app: mcp-ticketing
spec:
  selector:
    app: mcp-ticketing
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-ticketing
  labels:
    app: mcp-ticketing
spec:
  to:
    kind: Service
    name: mcp-ticketing
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Patch the llama-stack-config ConfigMap to register the MCP connector,
# then roll the Playground so it picks up the change.
# Requires the demo-setup ServiceAccount (created in setup-s3.yaml) with edit role.
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-llama-stack-mcp
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: demo-setup
      containers:
        - name: patch
          image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              # Idempotency check
              if oc get configmap llama-stack-config -o jsonpath='{.data.config\.yaml}' \
                   2>/dev/null | grep -q 'mcp::ticketing'; then
                echo "mcp::ticketing connector already present — nothing to do"
                exit 0
              fi

              echo "Patching llama-stack-config..."
              python3 - << 'PYEOF'
import subprocess, json, sys

r = subprocess.run(
    ['oc', 'get', 'configmap', 'llama-stack-config',
     '-o', 'jsonpath={.data.config\\.yaml}'],
    capture_output=True, text=True
)
if r.returncode != 0 or not r.stdout.strip():
    print("llama-stack-config not found or empty — skipping")
    sys.exit(0)

cfg = r.stdout

# Add 'connectors' to the apis list (after the opening 'apis:' line)
if '- connectors' not in cfg:
    cfg = cfg.replace('apis:\n', 'apis:\n- connectors\n', 1)

# Insert connectors section before 'server:'
connector_block = (
    "connectors:\n"
    "- connector_id: mcp::ticketing\n"
    "  connector_type: mcp\n"
    "  url: http://mcp-ticketing.hospital-helpdesk.svc.cluster.local:8080/mcp\n"
    "  server_label: Hospital IT Ticketing\n"
)
if 'connectors:' not in cfg:
    cfg = cfg.replace('server:\n  port: 8321',
                      connector_block + 'server:\n  port: 8321', 1)

patch = json.dumps({'data': {'config.yaml': cfg}})
r2 = subprocess.run(
    ['oc', 'patch', 'configmap', 'llama-stack-config',
     '--type=merge', '-p', patch],
    capture_output=True, text=True
)
if r2.returncode != 0:
    print("Patch failed:", r2.stderr)
    sys.exit(1)
print("ConfigMap patched successfully")
PYEOF

              echo "Rolling out lsd-genai-playground..."
              oc rollout restart deployment/lsd-genai-playground
              oc rollout status deployment/lsd-genai-playground --timeout=180s
              echo "Done."