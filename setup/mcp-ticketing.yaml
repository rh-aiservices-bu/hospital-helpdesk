apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-ticketing
  labels:
    app: mcp-ticketing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-ticketing
  template:
    metadata:
      labels:
        app: mcp-ticketing
    spec:
      containers:
        - name: mcp-ticketing
          image: quay.io/rlundber/hospital-helpdesk-mcp-ticketing:0.3
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-ticketing
  labels:
    app: mcp-ticketing
spec:
  selector:
    app: mcp-ticketing
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-ticketing
  labels:
    app: mcp-ticketing
spec:
  to:
    kind: Service
    name: mcp-ticketing
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Patch the llama-stack-config ConfigMap to register the MCP connector,
# then roll the Playground so it picks up the change.
# Requires the demo-setup ServiceAccount with edit role (created by the bootstrap job).
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-llama-stack-mcp
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: demo-setup
      containers:
        - name: patch
          image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              # Idempotency check
              if oc get configmap llama-stack-config -o jsonpath='{.data.config\.yaml}' \
                   2>/dev/null | grep -q 'mcp::ticketing'; then
                echo "mcp::ticketing connector already present — nothing to do"
                exit 0
              fi

              echo "Patching llama-stack-config..."

              # Write current config to a temp file
              oc get configmap llama-stack-config \
                -o jsonpath='{.data.config\.yaml}' > /tmp/config.yaml

              # Add connectors to the apis list if missing
              if ! grep -q '^\- connectors' /tmp/config.yaml; then
                sed -i 's/^apis:/apis:\n- connectors/' /tmp/config.yaml
              fi

              # Insert the connectors block before server: if missing
              if ! grep -q '^connectors:' /tmp/config.yaml; then
                awk '/^server:/{
                  print "connectors:"
                  print "- connector_id: mcp::ticketing"
                  print "  connector_type: mcp"
                  print "  url: http://mcp-ticketing.hospital-helpdesk.svc.cluster.local:8080/mcp"
                  print "  server_label: Hospital IT Ticketing"
                }1' /tmp/config.yaml > /tmp/config_new.yaml
                mv /tmp/config_new.yaml /tmp/config.yaml
              fi

              # Patch the ConfigMap (python3 used only for safe JSON encoding of the file)
              oc patch configmap llama-stack-config --type=merge \
                -p "$(python3 -c "import json; print(json.dumps({'data': {'config.yaml': open('/tmp/config.yaml').read()}}))")"
              echo "ConfigMap patched successfully"

              echo "Rolling out lsd-genai-playground..."
              oc rollout restart deployment/lsd-genai-playground
              oc rollout status deployment/lsd-genai-playground --timeout=180s
              echo "Done."
